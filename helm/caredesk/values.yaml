namespace: caredesk

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/EXAMPLE/caredesk-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    databaseUrl: postgresql+psycopg://caredesk:caredesk@caredesk-postgres:5432/caredesk

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/EXAMPLE/caredesk-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 5Gi
  credentials:
    user: caredesk
    password: caredesk
    database: caredesk

ingress:
  enabled: false
  className: nginx
  host: caredesk.local
  annotations: {}

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

serviceMonitor:
  enabled: true
  interval: 30s
