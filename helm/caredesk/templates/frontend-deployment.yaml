apiVersion: apps/v1
kind: Deployment
metadata:
  name: caredesk-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: caredesk-frontend
    {{- include "caredesk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: caredesk-frontend
  template:
    metadata:
      labels:
        app: caredesk-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: caredesk-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: caredesk-frontend
    {{- include "caredesk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: caredesk-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
