{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caredesk-postgres-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caredesk-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: caredesk-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caredesk-postgres
  template:
    metadata:
      labels:
        app: caredesk-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.credentials.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.credentials.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.credentials.password | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.credentials.user }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: caredesk-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: caredesk-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: caredesk-postgres
spec:
  type: ClusterIP
  selector:
    app: caredesk-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
