apiVersion: apps/v1
kind: Deployment
metadata:
  name: caredesk-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: caredesk-backend
    {{- include "caredesk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: caredesk-backend
  template:
    metadata:
      labels:
        app: caredesk-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              value: {{ .Values.backend.env.databaseUrl | quote }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: caredesk-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: caredesk-backend
    {{- include "caredesk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: caredesk-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
---
# Alias used by the frontend Nginx image (proxy_pass http://backend:8000)
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: caredesk-backend
spec:
  type: ClusterIP
  selector:
    app: caredesk-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
