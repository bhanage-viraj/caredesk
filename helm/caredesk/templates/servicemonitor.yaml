{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: caredesk-backend
  namespace: {{ .Values.namespace }}
  labels:
    release: prometheus
    {{- include "caredesk.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: caredesk-backend
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
