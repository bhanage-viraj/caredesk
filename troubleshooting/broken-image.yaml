apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image-demo
  namespace: caredesk
  labels:
    purpose: troubleshooting-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image-demo
  template:
    metadata:
      labels:
        app: broken-image-demo
    spec:
      containers:
        - name: app
          # Intentionally wrong image tag to produce ImagePullBackOff
          image: ghcr.io/example/caredesk-backend:does-not-exist
          ports:
            - containerPort: 8000
