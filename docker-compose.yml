services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caredesk
      POSTGRES_USER: caredesk
      POSTGRES_PASSWORD: caredesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caredesk -d caredesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://caredesk:caredesk@postgres:5432/caredesk
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
